# PostgreSQL local para desarrollo (ed_dev) y pruebas aisladas (ed_test).
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: proyecto_ed_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ed_dev
    ports:
      - "5432:5432"
    volumes:
      - ed_pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ed_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ed_pgdata:
